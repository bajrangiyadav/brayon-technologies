<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">BRAYON Technologies</title>
  <desc id="desc">Geometric B mark with BRAYON wordmark for dark UI</desc>
  <defs>
    <linearGradient id="bFill" x1="20" y1="12" x2="68" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Mark: website card radius + navy fill -->
  <rect x="8" y="10" width="76" height="76" rx="18" fill="#0A1128" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Custom B: two bowls + spine (no arrow / rocket) -->
  <path fill="url(#bFill)" d="M28 26h18.5c7.6 0 12.8 4.2 12.8 10.4 0 4.1-2.4 7.3-6.6 8.6 5.2 1.1 8.6 5.1 8.6 10.8 0 7.2-6.1 11.2-14.6 11.2H28V26Zm8.2 6.6v9.2h9.4c3.7 0 5.8-1.9 5.8-4.6s-2.1-4.6-5.8-4.6H36.2Zm0 16.2v11.2h10.6c4.4 0 6.8-2.3 6.8-5.6s-2.4-5.6-6.8-5.6H36.2Z"/>
  <!-- Status bar: site cyan accent, readable at favicon size -->
  <rect x="28" y="70" width="32" height="3.5" rx="1.75" fill="#22D3EE"/>

  <!-- Wordmark -->
  <text x="102" y="52" fill="#F8FAFC" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">BRAYON</text>
  <text x="102" y="74" fill="#94A3B8" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="4.2">TECHNOLOGIES</text>
  <rect x="102" y="80" width="28" height="2.5" rx="1.25" fill="#2563EB"/>
</svg>
