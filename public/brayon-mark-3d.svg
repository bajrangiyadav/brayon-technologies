<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="BRAYON">
  <defs>
    <linearGradient id="tileFace" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#152048"/>
      <stop offset="1" stop-color="#070B19"/>
    </linearGradient>
    <linearGradient id="bFront" x1="18" y1="12" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bSide" x1="46" y1="14" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bTop" x1="16" y1="10" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cyanFront" x1="18" y1="50" x2="46" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="1.6" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 3D tile: face + right + bottom extrusion -->
  <path d="M10 16h40l6 5v34c0 4.4-3.6 8-8 8H16c-4.4 0-8-3.6-8-8V24l2-8Z" fill="url(#tileFace)"/>
  <path d="M50 16l6 5v34c0 4.4-3.6 8-8 8h-2V24l4-8Z" fill="#020617" opacity="0.85"/>
  <path d="M10 16h40l6 5H16L10 16Z" fill="#24305A"/>
  <rect x="10" y="18" width="40" height="40" rx="11" fill="url(#tileFace)"/>
  <rect x="10.6" y="18.6" width="38.8" height="39" rx="10.4" stroke="#60A5FA" stroke-opacity="0.22"/>

  <g filter="url(#soft)">
    <!-- B extrusion (right + bottom) -->
    <path fill="url(#bSide)" d="M42.2 20.2 46.4 23.2v8.6l-4.2-2.4V20.2Zm5.4 16.4 4.2 3v9.4l-4.2-2.6v-9.8Z"/>
    <path fill="#1E3A8A" d="M20.2 48.6h16.6l4.2 2.8H24.4l-4.2-2.8Z"/>

    <!-- B front -->
    <path fill="url(#bFront)" d="M20 18.4h15.6c6.5 0 11 3.5 11 8.8 0 3.5-2 6.2-5.6 7.3 4.4.9 7.3 4.3 7.3 9.2 0 6.1-5.2 9.5-12.5 9.5H20V18.4Zm7 5.6v7.8h8.1c3.2 0 5-1.6 5-3.9s-1.8-3.9-5-3.9H27Zm0 13.8v9.5h9.1c3.8 0 5.9-2 5.9-4.75s-2.1-4.75-5.9-4.75H27Z"/>

    <!-- Top bevel on stem -->
    <path fill="url(#bTop)" d="M20 18.4h15.6c2.2 0 4.1.4 5.7 1.1H20v-1.1Z" opacity="0.9"/>
    <!-- Specular -->
    <path fill="#EFF6FF" opacity="0.35" d="M22.2 20.4h3.2v24.8h-3.2z"/>

    <!-- Cyan 3D bar -->
    <path fill="#0E7490" d="M20 51.2h26.5l3.2 2.6H23.2L20 51.2Z"/>
    <rect x="20" y="49.4" width="26.5" height="3.2" rx="1.4" fill="url(#cyanFront)"/>
  </g>
</svg>
